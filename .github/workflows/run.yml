name: stock
on:
  schedule:
    - cron: '05 07 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
